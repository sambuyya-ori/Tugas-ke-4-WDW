<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Produk Pilihan</h1>
    <p class="subtitle">Temukan produk yang sesuai mood kamu di Sambuyya Store</p>

    <div class="product-container">

        <div class="product-card">
            <img src="Jus Buah.jpg"
                 alt="Aneka Jus Buah Segar">

            <h2 id="nama-produk">Aneka Jus Buah 250ml</h2>

            <h3 class="harga">Rp10.000</h3>

            <p>
                Aneka Jus Buah segar dengan Gula Alami.
            </p>

            <button>Beli Sekarang</button>
        </div>


        <div class="product-card">
            <img src="Aneka Snack.jpg"
                 alt="Aneka Snack">

            <h2 id="nama-produk-2">Aneka Snack</h2>

            <h3 class="harga">Rp6.000</h3>

            <p>
                Snack yang cocok untuk teman nongkrongmu.
            </p>

            <button>Beli Sekarang</button>
        </div>


        <div class="product-card">
            <img src="Minuman.jpg"
                 alt="Minuman">

            <h2 id="nama-produk-3">Minuman 21+</h2>

            <h3 class="harga">Rp25.000 - Rp 150.000</h3>

            <p>
                Minuman untuk teman galaumu.
            </p>

            <button>Beli Sekarang</button>
        </div>

    </div>

</body>
</html>
